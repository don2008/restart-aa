name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - uses: android-actions/setup-android@v3
      - name: Build APKs
        run: gradle :app:assembleDebug :stepswidget:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
      - name: Upload Restart AA
        uses: actions/upload-artifact@v4
        with:
          name: Restart-AA
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Kroky Widget
        uses: actions/upload-artifact@v4
        with:
          name: Kroky-Widget
          path: stepswidget/build/outputs/apk/debug/stepswidget-debug.apk
